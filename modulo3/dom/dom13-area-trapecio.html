<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Manipulación de DOM </title>
    <script src="dom13-area-trapecio.js" defer></script>
  
</head>

<body>

    <h1 id="titulo"> Eventos en el DOM </h1>
    <h2> Area de un Trapecio </h2>

    <input id="baseM" 
        type="number"
        placeholder="Ingrese la base mayor del trapecio...">
    <input id="basem" 
        type="number"
        placeholder="Ingrese la base menor del trapecio...">
    <input id="altura" 
        type="number"
        placeholder="Ingrese la altura del trapecio...">
    <button id="btn_area" class="boton"> 
        Calcular Area </button>
    <div id ="error"></div>
    <p id="resultado"></p>

</body>
