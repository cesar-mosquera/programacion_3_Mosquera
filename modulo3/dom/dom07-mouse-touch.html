<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Manipulación de DOM </title>
    <script src="dom07-mouse-touch.js" defer></script>
    <style>
        .boton {
            background-color: red;
            border: none;
            border-radius: 5px;
            color: white;
            padding: 0%.5em 1em;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="titulo"> Eventos en el DOM </h1>
    <h2> Evento Mouse Touch </h2>
    <!-- Tercer ejemplo -->
    <h2> Evento Mouse Enter y Mouse Leave </h2>
    <div style="margin-top:20px;">
        <button id="botonAnimado" style="padding:10px 20px; 
        font-size:18px; 
        transition: all 0.3s;">¡Tócame o pasa el mouse!
        </button>
    </div>

</body>

</html>
