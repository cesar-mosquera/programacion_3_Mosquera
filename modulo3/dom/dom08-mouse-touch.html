<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Manipulación de DOM </title>
    <script src="dom08-mouse-touch.js" defer></script>
    <style>
        .boton {
            background-color: red;
            border: none;
            border-radius: 5px;
            color: white;
            padding: 0%.5em 1em;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="titulo"> Eventos en el DOM </h1>
    <h2> Evento Mouse Touch </h2>
    <!-- Cuarto ejemplo -->
    <h2> Evento Mouse Enter y Mouse Leave </h2>
    <div id="contenedorTriangulo" style="position:relative; 
        width:100%; 
        height:300px; 
        margin-top:20px; 
        background:whitesmoke;">
    <div id="triangulo" style="
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 100px solid crimson;
        position: absolute;
        top: 100px;
        left: calc(50% - 50px);
        transition: transform 0.2s ease;">
    </div>
    </div>

</body>

</html>
