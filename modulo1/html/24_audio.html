<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Audio </title>
</head>

<body>
    <!-- Básico -->
    <audio src="audios/danceo.ogg" controls></audio>
    <!-- Con Atributos -->
    <audio controls preload="metada">
        <source src="audios/rockm.mp3" type="audio/mp3">
        <source src="audios/danceo.ogg" type="audio/ogg">
        <source src="audios/rockw.wav" type="audio/wav">
    </audio>
    <audio src="audios/dancem.mp3" autoplay controls loop></audio>
</body>

</html>
