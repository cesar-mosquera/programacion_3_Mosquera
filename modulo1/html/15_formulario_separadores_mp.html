<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheels To Go - Registro Detallado</title>
</head>
<body>
    <h1> Completar Perfil de Conductor </h1>
    <form action="/api/perfil" method="post">
        
        <fieldset>
            <legend> Identidad del Conductor Principal </legend>
            <label for="nombre"> Nombres </label><br>
            <input type="text" id="nombre" name="nombre"><br><br>
            
            <label for="apellido"> Apellidos </label><br>
            <input type="text" id="apellido" name="apellido">
        </fieldset>  
        
        <fieldset>
            <legend> Credenciales de Acceso al Portal </legend>
            <label for="email"> Correo Electrónico Registrado </label><br>
            <input type="email" id="email" name="email"> <br><br>
            
            <label for="password"> Contraseña Segura </label><br>
            <input type="password" id="password" name="password">
        </fieldset>
        
        <br>
        <button type="submit">Guardar Perfil</button>
    </form>
</body>
</html>
