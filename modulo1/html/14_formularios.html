<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formularios </title>
</head>
<body>
    
    <h1> Formularios </h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre"> Nombre: </label>
                    <input type="text" id="nombre" name="nombre">
                </td>
                <td>
                    <label>Correo Electrónico:
                        <input type="email" id="email" name="email">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password"> Contraseña: </label>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="url"> Sitio Web: </label>
                    <input type="url" id="url" name="url">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="telefono"> Telefono: </label>
                    <input type="tel" id="telefono" name="telefono">
                </td>
                <td>
                    <label for="buscar"> Buscar: </label>
                    <input type="search" id="buscar" name="buscar">
                </td>
            </tr>
            <!-- Tipos Numéricos -->
             <tr>
                <td>
                    <label for="edad"> Edad </label>
                    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
                </td>
                <td>
                    <label for="Volumen"> Volumen <span id="val-vol">50</span></label><br>
                    <input type="range" id="volumen" name="volumen" min="0" max="120" value=50
                    oninput="document.getElementById('val-vol').textContent=this.value">
                </td>
             </tr>
        </table>
        <button type="submit"> Enviar </button>  
    </form>

</body>
</html>
