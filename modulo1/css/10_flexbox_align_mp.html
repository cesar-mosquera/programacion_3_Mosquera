<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheels To Go - Flexbox Align</title>
    <link rel="stylesheet" href="04_reset_mp.css" />
    <link rel="stylesheet" href="10_flexbox_align_mp.css" />
  </head>
  <body>

    <h1>Wheels To Go — align-items</h1>

    <h2>stretch (default)</h2>
    <div class="contenedor stretch">
      <div class="item">Económico</div>
      <div class="item">Intermedio</div>
      <div class="item">Premium</div>
    </div>

    <h2>flex-start</h2>
    <div class="contenedor inicio">
      <div class="item">Económico</div>
      <div class="item">Intermedio</div>
      <div class="item">Premium</div>
    </div>

    <h2>flex-end</h2>
    <div class="contenedor fin">
      <div class="item">Económico</div>
      <div class="item">Intermedio</div>
      <div class="item">Premium</div>
    </div>

    <h2>center</h2>
    <div class="contenedor centro">
      <div class="item">Económico</div>
      <div class="item">Intermedio</div>
      <div class="item">Premium</div>
    </div>

    <h2>baseline</h2>
    <div class="contenedor baseline">
      <div class="item">Pequeño</div>
      <div class="item">Mediano más largo</div>
      <div class="item">Texto de mayor tamaño</div>
    </div>

  </body>
</html>
