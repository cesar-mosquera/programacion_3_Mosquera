<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheels To Go - Flexbox Justify</title>
    <link rel="stylesheet" href="04_reset_mp.css" />
    <link rel="stylesheet" href="09_flexbox_justify_mp.css" />
  </head>
  <body>

    <h1>Wheels To Go — justify-content</h1>
    <h2>Distribución de categorías de vehículos</h2>

    <h3>flex-start (inicio)</h3>
    <div class="contenedor inicio">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

    <h3>flex-end (fin)</h3>
    <div class="contenedor fin">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

    <h3>center (centro)</h3>
    <div class="contenedor centro">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

    <h3>space-between</h3>
    <div class="contenedor between">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

    <h3>space-around</h3>
    <div class="contenedor around">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

    <h3>space-evenly</h3>
    <div class="contenedor evenly">
      <div class="item">Sedán</div>
      <div class="item">SUV</div>
      <div class="item">Camioneta</div>
    </div>

  </body>
</html>
