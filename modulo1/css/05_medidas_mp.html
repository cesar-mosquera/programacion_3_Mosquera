<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheels To Go - Medidas CSS</title>
    <link rel="stylesheet" href="04_reset_mp.css" />
    <link rel="stylesheet" href="05_medidas_mp.css" />
  </head>
  <body>

    <header class="header">
      <label class="btn-menu" for="toggle-menu">☰ Wheels To Go</label>
      <input type="checkbox" id="toggle-menu" />
      <nav class="menu-movil">
        <a href="#">Inicio</a>
        <a href="#">Vehículos</a>
        <a href="#">Mi Reserva</a>
      </nav>
    </header>

    <div class="vehiculo-card">
      <p>Nissan Sentra 2024 — $42.00/día</p>
    </div>

    <div class="vehiculo-card2">
      <p>Hyundai Tucson 2023 — $58.00/día</p>
    </div>

    <section>
      <h3>Botones con color-mix</h3>
      <button class="btn-primario-suave">Ver disponibilidad</button>
      <button class="btn-primario-oscuro">Confirmar reserva</button>
      <button class="gradiente-solido">Oferta del mes</button>
    </section>

    <div class="imagen">
      <div class="imagen-overlay">Flota disponible ahora mismo</div>
    </div>

    <section class="hero-banner"></section>
    <section class="seccion-destacados"></section>

  </body>
</html>
